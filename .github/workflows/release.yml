name: Release

# Publishes to PyPI via OIDC trusted publishing (no stored API token) - the same
# short-lived-token mechanism this tool exists to inspect. Fires when a GitHub
# Release is published. Requires the PyPI side to be configured once:
# pypi.org -> project "subcheck" (or a pending publisher before first release) ->
# owner Dashtid, repository subcheck, workflow release.yml, environment pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Deliberately a moving branch, per pypa's own guidance: it tracks
      # security fixes in the publish action; SHA-pinning here would freeze
      # them. The job has no other write surface (id-token only).
      - uses: pypa/gh-action-pypi-publish@release/v1
